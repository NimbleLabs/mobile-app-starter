# The app starts, shows sign-in, and moves between sign-in and sign-up.
# Needs only Metro — no API.
appId: host.exp.Exponent
---
- runFlow: ../subflows/open-app.yaml
- runFlow: ../subflows/start-signed-out.yaml
- takeScreenshot: maestro/screens/smoke-01-sign-in
- tapOn:
    id: sign-in-to-sign-up
- assertVisible: "Create account"
- tapOn:
    id: sign-up-to-sign-in
- assertVisible: "Welcome back"
