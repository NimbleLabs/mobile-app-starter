# iOS offers to save the password after a sign-up or sign-in. That sheet
# belongs to another iOS process: Maestro can't see it, and while it's up
# Maestro can't see the app either. So: if the screen we expect (EXPECT) is
# hidden, the sheet must be in the way — tap where its "Not Now" sits.
# Checked twice, because the sheet can arrive a beat after the screen does.
#
#   - runFlow:
#       file: ../subflows/dismiss-save-password.yaml
#       env:
#         EXPECT: "Hi, Maestro"
appId: host.exp.Exponent
---
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible: ${EXPECT}
    commands:
      - tapOn:
          point: "50%,62%"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      notVisible: ${EXPECT}
    commands:
      - tapOn:
          point: "50%,62%"
