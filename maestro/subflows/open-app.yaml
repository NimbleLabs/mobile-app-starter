# Opens the app in Expo Go, pointed at Metro, and waits for the first
# screen. Projects that move to a development build (expo-dev-client, e.g.
# for Sign in with Apple) swap this for a dev-build version — see
# maestro/README.md.
appId: host.exp.Exponent
---
- launchApp
# METRO_URL comes from scripts/e2e.sh (-e). Don't give it a default in a
# flow's env: block — that would override the command line.
- openLink: "${typeof METRO_URL === 'undefined' ? 'exp://127.0.0.1:8081' : METRO_URL}"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 20000
